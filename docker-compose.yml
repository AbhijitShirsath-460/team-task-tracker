version: '3.9'

services:
  # ─── Node.js API ───────────────────────────────────────────
  app:
    build: .
    container_name: task_tracker_app
    ports:
      - "8080:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/tasktracker
      REDIS_URL: redis://cache:6379
      JWT_ACCESS_SECRET: abhijit53
      JWT_REFRESH_SECRET: abhijit53@
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_DAYS: 7
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGIN: "*"
    depends_on:
      db:
        condition: service_healthy   # wait for postgres to be ready
      cache:
        condition: service_healthy   # wait for redis to be ready
    restart: unless-stopped

  # ─── PostgreSQL ─────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: task_tracker_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tasktracker
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis ──────────────────────────────────────────────────
  cache:
    image: redis:7-alpine
    container_name: task_tracker_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

# Named volume — persists postgres data across restarts
volumes:
  pgdata:
